services:
  postgres:
    image: postgres:17-alpine
    container_name: probiolab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: probiolab
      POSTGRES_USER: probiolab
      POSTGRES_PASSWORD: ${PROBIOLAB_POSTGRES_PASSWORD:-probiolab_local_seguro}
    ports:
      - "5432:5432"
    volumes:
      - probiolab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probiolab -d probiolab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  probiolab_postgres_data:
